name: Build VerityPlugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven Wrapper
        run: ./mvnw -B package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VerityPlugin
          path: target/VerityPlugin-1.0.0.jar
